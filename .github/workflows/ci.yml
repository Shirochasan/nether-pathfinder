name: CI

on:
  push:
    # masterブランチへのpush、またはPRで実行
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# 同一PRで新しいコミットがあれば古いジョブをキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2 # バージョンを明示的に指定するとactが安定する場合がある
        with:
          submodules: recursive

      - name: Setup Java for Gradle Action
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          install_options: '--no-daemon'
          kvm: false # act環境でのエラーログ抑制

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.1
        with:
          cache-disabled: false # デフォルトで有効ですが明示

      - name: Build with Nix shell
        run: nix develop --command bash -c "cd java && chmod +x gradlew && ./gradlew clean build --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.paths=\"$JDK8_HOME,$JDK21_HOME\""
        env:
          # Nix経由で提供される特定のツールチェーンを利用する場合の環境変数
          # 必要に応じて flake.nix 等で管理することを推奨します
          CI: true

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && !env.ACT
        run: nix develop --command bash -c "cd java && ./gradlew publish --no-daemon -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.paths=\"$JDK8_HOME,$JDK21_HOME\""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
